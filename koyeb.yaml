# Koyeb auto-deploy config for cs16-ai-manager
# https://koyeb.com/docs/build-and-run/app-deployment-configuration
name: cs16-ai-manager

services:
  - name: cs16-ai-manager
    type: web
    git:
      url: https://github.com/dhiksjf/cs16-ai-manager.git
      branch: main
    instance_type: free
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    health_checks:
      - path: /api/healthz
        port: 8000
        interval: 30
        timeout: 5
        retries: 3
    env:
      - name: PORT
        value: "8000"
      - name: STATIC_DIR
        value: /app/static